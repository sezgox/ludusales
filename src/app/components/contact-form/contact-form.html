<form class="contact-form stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="contact-form-row">
        <input class="form-input contact-input" type="text" formControlName="firstName" autocomplete="given-name" aria-label="Nombre" placeholder="Nombre" />
        <input class="form-input contact-input" type="text" formControlName="lastName" autocomplete="family-name" aria-label="Apellidos" placeholder="Apellidos" />
    </div>
    <input class="form-input contact-input" type="email" formControlName="email" autocomplete="email" aria-label="Email de contacto" placeholder="Email contacto" />
    <input class="form-input contact-input" type="text" formControlName="company" autocomplete="organization" aria-label="Nombre de tu empresa" placeholder="Nombre de tu empresa" />
    <input class="form-input contact-input" type="text" formControlName="teamSize" aria-label="Tamaño del equipo de ventas" placeholder="Tamaño del equipo de ventas" />
    <button class="primary-button contact-button" type="submit" [disabled]="status() === 'sending'">
        {{ status() === 'sending' ? 'Enviando...' : submitLabel() }}
    </button>
    @if (form.invalid && form.touched) {
        <p class="form-feedback contact-form-feedback" aria-live="polite">Completa todos los campos antes de agendar la llamada.</p>
    }
    @if (status() === 'sent') {
        <p class="form-feedback contact-form-feedback contact-form-feedback--success" aria-live="polite">Solicitud enviada. Te contactaremos pronto.</p>
    }
    @if (status() === 'error') {
        <p class="form-feedback contact-form-feedback" aria-live="polite">No hemos podido enviar la solicitud. Escríbenos a {{ contactEmail() }}.</p>
    }
</form>
