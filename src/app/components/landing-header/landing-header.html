<header class="landing-header">
    <div class="landing-header__side">
        <a routerLink="/" class="landing-header__brand" aria-label="Volver al inicio">
            <img ngSrc="assets/pages/landing/home/brand.png" width="234" height="52" alt="Ludus Sales" class="landing-header__wordmark" priority>
        </a>
    </div>

    <nav class="landing-header__nav" aria-label="Principal">
        <a routerLink="/gamificacion" routerLinkActive="landing-header__link--active" class="landing-header__link">Gamificación de ventas</a>
        <a routerLink="/funcionamiento" routerLinkActive="landing-header__link--active" class="landing-header__link">Funcionamiento</a>
        <a routerLink="/piloto" routerLinkActive="landing-header__link--active" class="landing-header__link">Piloto 30-Días</a>
        <a routerLink="/nosotros" routerLinkActive="landing-header__link--active" class="landing-header__link">Nosotros</a>
    </nav>

    <div class="landing-header__side landing-header__side--end">
        <div class="landing-header__actions">
            <a routerLink="/nosotros" fragment="contact" class="landing-header__cta hover-button active-button">Agendar reunión</a>
            <a routerLink="/login" class="landing-header__access hover-button active-button" aria-label="Acceso">
                <span class="landing-header__access-label">Acceso</span>
                <svg lucideLogIn [size]="18" class="landing-header__access-icon" aria-hidden="true"></svg>
            </a>
        </div>
    </div>
</header>

<nav class="landing-header__mobile-nav" aria-label="Secciones">
    <a routerLink="/gamificacion" routerLinkActive="landing-header__mobile-link--active" class="landing-header__mobile-link">Gamificación</a>
    <a routerLink="/funcionamiento" routerLinkActive="landing-header__mobile-link--active" class="landing-header__mobile-link">Funcionamiento</a>
    <a routerLink="/piloto" routerLinkActive="landing-header__mobile-link--active" class="landing-header__mobile-link">Piloto 30-Días</a>
    <a routerLink="/nosotros" routerLinkActive="landing-header__mobile-link--active" class="landing-header__mobile-link">Nosotros</a>
</nav>
